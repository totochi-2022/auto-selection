<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>ブックマーク</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --panel2: #222933; --line: #2e3742;
    --text: #e8ecf1; --muted: #8d99a8; --accent: #4fa3ff; --accent-ink: #06121f;
    --good: #3ecf8e; --bad: #ff6b6b; --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5; --line: #d9dee5;
      --text: #18202a; --muted: #5d6b7c; --accent: #1f6fd1; --accent-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 720px; margin: 0 auto; padding: 12px 16px 32px; }
  /* タブ・動画の操作・シークバー・開き方は上に固定し、ブックマークの一覧だけスクロールする */
  .ctl { position: sticky; top: 0; z-index: 5; background: var(--bg); margin: -12px -16px 8px; padding: 12px 16px 6px;
    border-bottom: 1px solid var(--line); }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  h1 { font-size: 20px; margin: 0; }
  header .jump { margin-left: auto; display: flex; gap: 6px; }
  header .jump button { padding: 2px 12px; line-height: 1.5; font: inherit; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
  header a { color: var(--accent); text-decoration: none; }
  .msg { color: var(--muted); font-size: 12px; min-height: 1.4em; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* ブックマーク（テレビの Brave のブックマークバー） */
  .bm { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .bm button { display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px; min-height: 48px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; cursor: pointer; }
  .bm img, .bm .noicon { width: 20px; height: 20px; flex: none; border-radius: 4px; }
  .bm .noicon { display: grid; place-items: center; background: var(--line); font-size: 12px; }
  .bm span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 14px; line-height: 1.3; }
  /* 同じサイトのタブがもうテレビの Brave にある（「同じサイトのタブへ」なら新しく開かずにそこへ飛ぶ） */
  .bm button.open { border-color: var(--good); background: color-mix(in srgb, var(--good) 22%, var(--panel2)); }
  /* 1 つだけ開いているときは緑の色だけ（2 つ以上なら下の数の丸） */
  /* 同じサイトのタブが 2 つ以上：数を出す。「同じサイトのタブへ」で押すたびに順に回る */
  .bm button.open[data-n]::after { content: attr(data-n); margin-left: auto; flex: none; min-width: 1.6em; padding: 1px 6px; border-radius: 9px; text-align: center;
    font-size: 13px; font-weight: bold; background: var(--good); color: var(--panel2); }
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
  .tabs button { padding: 10px 4px; font: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); cursor: pointer; }
  .vid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 8px; }
  .vid button, .vol button { padding: 10px 0; font-size: 20px; line-height: 1; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); cursor: pointer; }
  .vol { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .vol button { flex: 0 0 52px; }
  .vol input { flex: 1; min-width: 0; accent-color: var(--accent); height: 32px; }
  .vol span { flex: 0 0 auto; min-width: 3em; text-align: right; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .how { display: none !important; }
  .how.x { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 10px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg label { cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg span { display: block; padding: 7px 10px; font-size: 13px; background: var(--panel2); }
  .seg label + label span { border-left: 1px solid var(--line); }
  .seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
  .how .solo { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
  .how .solo input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  /* ?nohead=1（phone-input の 🎮 操作の中）：見出しの行を出さない（端末・動画は phone-input のマウス・キーボードの帯へ） */
  body.nohead header { display: none; }
  body.nohead .vol { margin-bottom: 2px; }
  body.nohead .ctl { padding-bottom: 2px; margin-bottom: 6px; }
  body.nohead .msg { display: none; }  /* 押したボタンの知らせは出さない（ユーザーの希望） */
</style>
</head>
<body>
<main>
  <div class="ctl">
  <header><a id="back" href="/">← autotube</a><h1>🔖 ブックマーク</h1>
    <span class="jump"><button data-jump="term" title="テレビを端末（ttyd のタブ）に。F7＋T と同じ">端末</button><button data-jump="video" title="テレビを動画（mpv かプレーヤーのタブ）に。F7＋M と同じ">動画</button></span></header>
  <div class="tabs">
    <button data-tabs="prev" title="テレビの Brave の左のタブへ">◀ 前</button>
    <button data-tabs="next" title="テレビの Brave の右のタブへ">次 ▶</button>
    <button data-tabs="close" title="テレビの Brave で今出ているタブを閉じる">✕ 閉じる</button>
    <button id="fsBtn" title="F6 と同じ。テレビで今出ている動画を全画面に（もう一度で戻る）">⛶ 全画面</button>
  </div>
  <div class="vid">
    <button data-v="back180" title="3 分戻る（F6＋G）">⏮</button>
    <button data-v="back60" title="1 分戻る（F6＋H）">⏪</button>
    <button data-v="back" title="10 秒戻る（F6＋J）">↺</button>
    <button data-v="toggle" title="再生・一時停止（F6＋K）">⏯</button>
    <button data-v="fwd" title="10 秒進む（F6＋L）">↻</button>
    <button data-v="fwd60" title="1 分進む（F6＋;）">⏩</button>
    <button data-v="fwd180" title="3 分進む（F6＋:）">⏭</button>
  </div>
  <div class="vol">
    <button data-v="voldown" title="音量を下げる">🔉</button>
    <input type="range" id="seek" min="0" max="100" step="0.1" value="0" title="動画のその割合の位置へ（離したときに移動）">
    <span id="seekPct">--:--</span>
    <button data-v="volup" title="音量を上げる">🔊</button>
  </div>
  <div class="how">
    <span class="seg">
      <label><input type="radio" name="how" value="site" checked><span>同じサイト</span></label>
      <label><input type="radio" name="how" value="new"><span>新しいタブ</span></label>
      <label><input type="radio" name="how" value="here"><span>今のタブ</span></label>
    </span>
    <label class="solo"><input type="checkbox" id="solo" checked> ほかの動画を止める</label>
  </div>
  <div class="msg" id="msg"></div>
  </div><!-- /ctl：上に固定（ブックマークの一覧だけスクロール） -->
  <section id="bmSec">
    <div id="bm" class="bm"></div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t") || "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
if (token) $("back").href = "/?t=" + encodeURIComponent(token);
if (window.top !== window) $("back").hidden = true;
if (new URLSearchParams(location.search).get("nohead") === "1") {
  document.body.classList.add("nohead");
}  // phone-input の画面の中（iframe）では戻るリンクは要らない（ふだんはそこから開く）
async function api(name, body = {}) {
  try {
    await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": token }, body: JSON.stringify(body) });
  } catch (e) {
    $("msg").textContent = "サーバーに届きませんでした";
  }
}

// ブックマーク：テレビの Brave のブックマークバー。押すと上で選んだ開き方ですぐ開く（選んだものはこのスマホに覚える）
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const savedHow = store.get("bmHow");
// 開き方は「同じサイト」・「ほかの動画を止める」オンで固定（ユーザーの希望、2026-11-21）。選ぶ行は隠した（.how）。
// 戻すときはこの 2 行を消して .how の display:none を外す
document.querySelectorAll('input[name="how"]').forEach((r) => r.addEventListener("change", () => store.set("bmHow", r.value)));
$("solo").addEventListener("change", () => store.set("bmSolo", $("solo").checked ? "1" : "0"));

// 見出しの右の 端末／動画：テレビの画面をそこへ（「ほかの動画を止める」のチェックに従う）
document.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
  api("jump", { where: b.dataset.jump, solo: $("solo").checked });
  $("msg").textContent = `テレビを${b.textContent}にしました`;
}));

// タブの左右・閉じる
const TABS_MSG = { prev: "左のタブへ", next: "右のタブへ", close: "タブを閉じました" };
document.querySelectorAll("[data-tabs]").forEach((b) => b.addEventListener("click", () => {
  api("tabs", { how: b.dataset.tabs, solo: $("solo").checked });
  $("msg").textContent = TABS_MSG[b.dataset.tabs];
  setTimeout(markOpen, 1200);
}));

// 動画のボタン（F6＋キーと同じ）とシークバー（その割合の位置へ、離したときに）
document.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => {
  api("video", { cmd: b.dataset.v });
  $("msg").textContent = b.title;
}));
// シークバーは今の動画の位置に合わせて動く（1 秒ごとに /api/vstate）。つまんでいる間と、離して飛んだ直後の 2.5 秒は合わせない
let seekDrag = false, seekHold = 0, vDur = 0;
const fmt = (t) => { t = Math.max(0, Math.floor(t)); const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, s = t % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0"); };
const seekLabel = () => { const p = Number($("seek").value);
  $("seekPct").textContent = vDur ? `${fmt(vDur * p / 100)} / ${fmt(vDur)}` : Math.round(p) + "%"; };
["pointerdown", "touchstart", "mousedown"].forEach((e) => $("seek").addEventListener(e, () => { seekDrag = true; }, { passive: true }));
$("seek").addEventListener("input", () => { seekDrag = true; seekLabel(); });
$("seek").addEventListener("change", () => {
  seekDrag = false; seekHold = Date.now() + 2500;
  api("video", { cmd: "pct:" + $("seek").value });
  $("msg").textContent = `${$("seekPct").textContent.split(" /")[0]} の位置へ`;
});
["pointerup", "pointercancel", "touchend"].forEach((e) => document.addEventListener(e, () => {
  if (seekDrag) setTimeout(() => { seekDrag = false; }, 300);  // change が来ないまま離したとき
}, { passive: true }));
async function syncSeek() {
  if (document.hidden || seekDrag || Date.now() < seekHold) return;
  try {
    const st = await (await fetch("/api/vstate", { headers: { "X-Token": token } })).json();
    if (seekDrag || Date.now() < seekHold) return;
    // 動画が無い・ライブ（長さ 0）。ABEMA の放送中のチャンネルは位置が 1970 年からの秒（放送の時刻）で来るので時刻で出す
    if (!st || !st.d) { vDur = 0; $("seekPct").textContent = !st ? "--:--" : st.t > 1e9 ? "ライブ " + new Date(st.t * 1000).toLocaleTimeString("ja-JP") : "ライブ " + fmt(st.t); return; }
    vDur = st.d;
    $("seek").value = (st.t / st.d * 100).toFixed(1);
    seekLabel();
  } catch (e) {}
}
setInterval(syncSeek, 1000);
document.querySelectorAll("[data-v]").forEach((b) => b.addEventListener("click", () => { seekHold = 0; setTimeout(syncSeek, 600); }));

$("fsBtn").addEventListener("click", () => { api("fullscreen"); $("msg").textContent = "全画面を切り替えました"; });

async function loadBookmarks() {
  try {
    const items = await (await fetch("/api/bookmarks", { headers: { "X-Token": token } })).json();
    if (!items.length) $("msg").textContent = "ブックマークがありません";
    $("bm").innerHTML = items.map((b, i) => `<button data-bm="${i}" data-host="${esc(hostOf(b.url))}" title="${esc(b.url)}">`
      + (b.icon ? `<img src="${b.icon}" alt="">` : `<span class="noicon">${esc((b.name || "?")[0])}</span>`)
      + `<span>${esc(b.name || b.url)}</span></button>`).join("");
    $("bm").onclick = (e) => {
      const btn = e.target.closest("[data-bm]");
      if (!btn) return;
      const b = items[Number(btn.dataset.bm)];
      const how = document.querySelector('input[name="how"]:checked').value;
      api("openurl", { url: b.url, how, solo: $("solo").checked });
      setTimeout(markOpen, 1500);
      $("msg").textContent = `開きました：${b.name || b.url}`;
    };
    markOpen();
  } catch (e) { /* ブックマークが無い PC（Pi）では出さない */ }
}

// もうタブがあるブックマークに色を付ける（テレビの Brave で開いているタブのホストと比べる）。開いている間は 4 秒ごとに見直す
function hostOf(u) { try { return new URL(u).host; } catch (e) { return ""; } }
async function markOpen() {
  try {
    const n = {};  // ホストごとのタブの数
    for (const h of await (await fetch("/api/openhosts", { headers: { "X-Token": token } })).json()) n[h] = (n[h] || 0) + 1;
    document.querySelectorAll("#bm [data-host]").forEach((b) => {
      const c = n[b.dataset.host] || 0;
      b.classList.toggle("open", c > 0);
      if (c > 1) b.dataset.n = c; else delete b.dataset.n;
    });
  } catch (e) {}
}
setInterval(() => { if (!document.hidden) markOpen(); }, 4000);
loadBookmarks();
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadBookmarks(); });

</script>
<script>
// phone-input の 🎮 操作・▶ autotube の枠の中で開かれたとき：スマホの傾きの知らせを親（phone-input）へ渡す。
// Chrome は触った枠にしか知らせを渡さないので、これが無いと枠に触ったあと振っても画面が移らない
if (window.parent !== window) window.addEventListener("devicemotion", (e) => {
  if (!document.hasFocus()) return;
  const v = (o, k) => o ? { x: o[k[0]], y: o[k[1]], z: o[k[2]] } : null;
  const r = e.rotationRate;
  parent.postMessage({ pimotion: {
    ig: v(e.accelerationIncludingGravity, "xyz"), a: v(e.acceleration, "xyz"),
    r: r ? { alpha: r.alpha, beta: r.beta, gamma: r.gamma } : null } }, "*");
});
</script>
</body>
</html>
