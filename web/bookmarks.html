<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>ブックマーク</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --panel2: #222933; --line: #2e3742;
    --text: #e8ecf1; --muted: #8d99a8; --accent: #4fa3ff; --accent-ink: #06121f;
    --good: #3ecf8e; --bad: #ff6b6b; --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5; --line: #d9dee5;
      --text: #18202a; --muted: #5d6b7c; --accent: #1f6fd1; --accent-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-tap-highlight-color: transparent; }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
  h1 { font-size: 20px; margin: 0; }
  header .jump { margin-left: auto; display: flex; gap: 6px; }
  header .jump button { padding: 2px 12px; line-height: 1.5; font: inherit; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text); cursor: pointer; }
  header a { color: var(--accent); text-decoration: none; }
  .msg { color: var(--muted); font-size: 13px; min-height: 1.5em; margin-top: 10px; }
  /* ブックマーク（テレビの Brave のブックマークバー） */
  .bm { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .bm button { display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px; min-height: 48px;
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; cursor: pointer; }
  .bm img, .bm .noicon { width: 20px; height: 20px; flex: none; border-radius: 4px; }
  .bm .noicon { display: grid; place-items: center; background: var(--line); font-size: 12px; }
  .bm span { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 14px; line-height: 1.3; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .tabs button { padding: 12px 4px; font: inherit; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel2); color: var(--text); cursor: pointer; }
  .how { display: grid; gap: 6px; margin-bottom: 14px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .how label { display: grid; grid-template-columns: auto 1fr; column-gap: 8px; align-items: center; cursor: pointer; }
  .how input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
  .how small { grid-column: 2; color: var(--muted); font-size: 12px; line-height: 1.3; }
  .how .solo { border-top: 1px solid var(--line); padding-top: 8px; margin-top: 2px; }
</style>
</head>
<body>
<main>
  <header><a id="back" href="/">← autotube</a><h1>🔖 ブックマーク</h1>
    <span class="jump"><button data-jump="term" title="テレビを端末（ttyd のタブ）に。F7＋T と同じ">端末</button><button data-jump="video" title="テレビを動画（mpv かプレーヤーのタブ）に。F7＋M と同じ">動画</button></span></header>
  <div class="tabs">
    <button data-tabs="prev" title="テレビの Brave の左のタブへ">◀ 前のタブ</button>
    <button data-tabs="next" title="テレビの Brave の右のタブへ">次のタブ ▶</button>
    <button data-tabs="close" title="テレビの Brave で今出ているタブを閉じる">✕ 閉じる</button>
  </div>
  <div class="how">
    <label><input type="radio" name="how" value="site" checked> 同じサイトのタブへ<small>そのサイトのタブがあれば移る（ページは違っても）。無ければ新しいタブ</small></label>
    <label><input type="radio" name="how" value="new"> 新しいタブ</label>
    <label><input type="radio" name="how" value="here"> 今のタブ<small>テレビで今出ているタブがこのページに替わる</small></label>
    <label class="solo"><input type="checkbox" id="solo" checked> ほかの動画を止める<small>F7 と同じ。行き先以外の動画を一時停止し、行き先で止めていたものは再開</small></label>
  </div>
  <section id="bmSec">
    <div id="bm" class="bm"></div>
  </section>
  <div class="msg" id="msg">テレビの Brave のブックマークバー。押すと上の開き方ですぐ開きます</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t") || "";
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
if (token) $("back").href = "/?t=" + encodeURIComponent(token);
if (window.top !== window) $("back").hidden = true;  // phone-input の画面の中（iframe）では戻るリンクは要らない（ふだんはそこから開く）
async function api(name, body = {}) {
  try {
    await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": token }, body: JSON.stringify(body) });
  } catch (e) {
    $("msg").textContent = "サーバーに届きませんでした";
  }
}

// ブックマーク：テレビの Brave のブックマークバー。押すと上で選んだ開き方ですぐ開く（選んだものはこのスマホに覚える）
const store = { get: (k) => { try { return localStorage.getItem(k); } catch (e) { return null; } },
                set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} } };
const savedHow = store.get("bmHow");
if (savedHow) document.querySelectorAll('input[name="how"]').forEach((r) => { r.checked = r.value === savedHow; });
if (store.get("bmSolo") !== null) $("solo").checked = store.get("bmSolo") === "1";
document.querySelectorAll('input[name="how"]').forEach((r) => r.addEventListener("change", () => store.set("bmHow", r.value)));
$("solo").addEventListener("change", () => store.set("bmSolo", $("solo").checked ? "1" : "0"));

// 見出しの右の 端末／動画：テレビの画面をそこへ（「ほかの動画を止める」のチェックに従う）
document.querySelectorAll("[data-jump]").forEach((b) => b.addEventListener("click", () => {
  api("jump", { where: b.dataset.jump, solo: $("solo").checked });
  $("msg").textContent = `テレビを${b.textContent}にしました`;
}));

// タブの左右・閉じる
const TABS_MSG = { prev: "左のタブへ", next: "右のタブへ", close: "タブを閉じました" };
document.querySelectorAll("[data-tabs]").forEach((b) => b.addEventListener("click", () => {
  api("tabs", { how: b.dataset.tabs });
  $("msg").textContent = TABS_MSG[b.dataset.tabs];
}));

async function loadBookmarks() {
  try {
    const items = await (await fetch("/api/bookmarks", { headers: { "X-Token": token } })).json();
    if (!items.length) $("msg").textContent = "ブックマークがありません";
    $("bm").innerHTML = items.map((b, i) => `<button data-bm="${i}" title="${esc(b.url)}">`
      + (b.icon ? `<img src="${b.icon}" alt="">` : `<span class="noicon">${esc((b.name || "?")[0])}</span>`)
      + `<span>${esc(b.name || b.url)}</span></button>`).join("");
    $("bm").onclick = (e) => {
      const btn = e.target.closest("[data-bm]");
      if (!btn) return;
      const b = items[Number(btn.dataset.bm)];
      const how = document.querySelector('input[name="how"]:checked').value;
      api("openurl", { url: b.url, how, solo: $("solo").checked });
      $("msg").textContent = `開きました：${b.name || b.url}`;
    };
  } catch (e) { /* ブックマークが無い PC（Pi）では出さない */ }
}
loadBookmarks();
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadBookmarks(); });

</script>
</body>
</html>
