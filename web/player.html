<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>autotube プレーヤー</title>
<!--
  ブラウザで再生するモードのページ（web.py の /player）。開くと web.py がこのモードになり、mpv は止まる。
  左に動画（<video>。web.py が yt-dlp で落としたファイル /media/<key>）、右に再生中と次に流れる動画。
  右の行はボタンなので Vimium の f で選べる。F9（F6 単独）で動画を全画面、F6＋矢印などの操作は拡張機能 tv-fullscreen がそのまま効く。
-->
<style>
  :root { --bg: #111; --panel: #1b1b1b; --line: #2c2c2c; --fg: #eee; --dim: #9a9a9a; --accent: #4fa3ff; --ok: #5cc47a; --warn: #e0a640; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  body { display: flex; gap: 0; overflow: hidden; }
  #stage { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }
  #wrap { position: relative; flex: 1 1 auto; background: #000; display: flex; align-items: center; justify-content: center; min-height: 0; }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; }
  #veil { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
          color: var(--dim); font-size: 22px; text-align: center; padding: 20px; pointer-events: none; }
  #veil.hidden { display: none; }
  /* リストの Brave で開くもの（アニメ・生放送など）は、動画の代わりにページ（中のプレーヤーだけのこともある）を埋め込む */
  #emb { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  #emb[hidden], video.off, #ytbox[hidden] { display: none; }
  /* YouTube は埋め込みのプレーヤー（IFrame API）で流す。吹き替えもこの上に重ねる */
  #ytbox, #ytbox iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #dsub, #pbar { z-index: 2; }  /* 吹き替えの字幕と下のバーは埋め込みの上に */
  #unmute { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 18px; }
  #info { padding: 10px 16px 12px; border-top: 1px solid var(--line); }
  #title { font-size: 18px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sub { color: var(--dim); font-size: 13px; margin-top: 2px; display: flex; gap: 14px; flex-wrap: wrap; }
  #side { flex: 0 0 360px; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #side h2 { font-size: 13px; color: var(--dim); font-weight: 600; margin: 12px 14px 6px; }
  #list { overflow-y: auto; padding: 0 8px 8px; flex: 1 1 auto; }
  .item { display: flex; gap: 10px; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: inherit;
          padding: 6px; border-radius: 8px; cursor: pointer; font: inherit; align-items: flex-start; }
  .item:hover, .item:focus-visible { background: #262626; border-color: var(--line); outline: none; }
  .item.now { background: #1f2a38; border-color: #2d4a6b; cursor: default; }
  .thumb { position: relative; flex: 0 0 136px; height: 76px; border-radius: 6px; overflow: hidden; background: #000; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .dur { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.8); font-size: 12px; padding: 0 5px; border-radius: 4px; }
  .meta { min-width: 0; flex: 1; }
  .meta .t { font-size: 14px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .meta .c { font-size: 12px; color: var(--dim); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .meta .s { font-size: 12px; margin-top: 2px; }
  .s.ready { color: var(--ok); } .s.loading { color: var(--warn); } .s.error { color: #e06060; }
  #bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  button.b { background: #2a2a2a; color: var(--fg); border: 1px solid #3a3a3a; border-radius: 8px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button.b:hover, button.b:focus-visible { border-color: var(--accent); outline: none; }
  #status { color: var(--dim); font-size: 12px; padding: 0 14px 10px; }
  @media (max-width: 800px) { body { flex-direction: column; } #side { flex: 0 0 40%; border-left: 0; border-top: 1px solid var(--line); } }
  #pbar { position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: rgba(255,255,255,.12); }
  #pbar > div { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
  #pbFill { background: rgba(79,163,255,.8); }                 /* 再生したところ：水色 */
  #pbDub { top: auto; height: 3px; background: #3fb950; }       /* 吹き替えがあるところ：下に細く緑 */
  #pbHead { width: 3px; background: #fff; }                     /* 今の位置 */
  #dsub { position: absolute; left: 4%; right: 4%; bottom: 9%; text-align: center; font-size: 30px; line-height: 1.4;
          color: #fff; text-shadow: 0 0 6px #000, 0 0 3px #000; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <video id="v" playsinline disableremoteplayback></video><div id="dsub"></div><div id="pbar"><div id="pbFill"></div><div id="pbDub"></div><div id="pbHead"></div></div><!-- disableremoteplayback：左上に出るキャストのボタンを消す -->
    <div id="ytbox" hidden><div id="ytp"></div></div>
    <iframe id="emb" hidden allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen></iframe>
    <div id="veil">希望をリモコンで入れて「スタート」すると、ここで再生します</div>
    <button class="b" id="unmute" hidden>🔇 音が消えています（押すと音を出す）</button>
  </div>
  <div id="info">
    <div id="title">—</div>
    <div id="sub"><span id="chan"></span><span id="pos"></span></div>
  </div>
</div>
<aside id="side">
  <h2>次に流れる</h2>
  <div id="list"></div>
  <div id="status"></div>
  <div id="bar">
    <button class="b" id="next">⏭ 次へ</button>
    <button class="b" id="mpv">mpv で再生に戻す</button>
    <a class="b" href="/" style="text-decoration:none;display:inline-block">リモコン</a>
  </div>
</aside>
<script>
const $ = (id) => document.getElementById(id);
const vid = $("v");

// YouTube の埋め込みのプレーヤーを <video> と同じ形で扱う（吹き替え・位置・操作は M＝今の動画 だけを見る）
class YTMedia extends EventTarget {
  constructor() { super(); this.p = null; this.ready = null; this.id = ""; this._t = 0; this._paused = true; this._vol = 1; this._muted = false; }
  load(id) {
    this.id = id; this._t = 0; this._paused = true;
    if (!this.ready) {
      this.ready = new Promise((res) => {
        window.onYouTubeIframeAPIReady = () => {
          this.p = new YT.Player("ytp", { videoId: id, playerVars: { autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1, cc_load_policy: 0, iv_load_policy: 3 },
            events: { onReady: () => { this.p.setVolume(this._vol * 100); res(); },
                      onStateChange: (e) => this._state(e.data),
                      onPlaybackRateChange: () => this._ev("ratechange"),
                      onError: (e) => this._ev("error", e.data) } });
        };
        const sc = document.createElement("script"); sc.src = "https://www.youtube.com/iframe_api"; document.head.appendChild(sc);
      });
    } else this.ready.then(() => this.p.loadVideoById(id));
    if (!this._poll) this._poll = setInterval(() => this._tick(), 250);
  }
  stop() { this.id = ""; if (this.p && this.p.stopVideo) this.p.stopVideo(); }
  _ev(type, detail) { const e = new Event(type); e.detail = detail; this.dispatchEvent(e); }
  _state(st) {
    if (st === 1) {
      // YouTube の字幕（自動生成の日本語など）は出さない。埋め込みは前に字幕を出した設定を覚えていて勝手に出す
      if (this._ccOff !== this.id) { this._ccOff = this.id; try { this.p.unloadModule("captions"); this.p.unloadModule("cc"); } catch (e) {} }
      this._paused = false; this._ev("play");
    }
    else if (st === 2) { this._paused = true; this._ev("pause"); }
    else if (st === 0) { this._paused = true; this._ev("ended"); }
    else if (st === 3) this._ev("seeking");
  }
  _tick() {
    if (!this.p || !this.p.getCurrentTime || !this.id) return;
    const t = this.p.getCurrentTime(), exp = this._t + (this._paused ? 0 : 0.25 * this.playbackRate);
    const jumped = Math.abs(t - exp) > 1.5;
    this._t = t;
    if (jumped) { this._ev("seeking"); this._ev("seeked"); }
    this._ev("timeupdate");
  }
  get currentTime() { return this.p && this.p.getCurrentTime ? this.p.getCurrentTime() : 0; }
  set currentTime(t) { if (this.p) { this.p.seekTo(t, true); this._t = t; this._ev("seeking"); this._ev("seeked"); } }
  get duration() { return this.p && this.p.getDuration ? this.p.getDuration() : 0; }
  get paused() { return this._paused; }
  get seeking() { return false; }
  get playbackRate() { return this.p && this.p.getPlaybackRate ? this.p.getPlaybackRate() : 1; }
  get volume() { return this._vol; }
  set volume(x) { this._vol = x; if (this.p && this.p.setVolume) this.p.setVolume(Math.round(x * 100)); }
  get muted() { return this._muted; }
  set muted(m) { this._muted = m; if (this.p) m ? this.p.mute() : this.p.unMute(); this._ev("volumechange"); }
  play() { if (this.p) this.p.playVideo(); return Promise.resolve(); }
  pause() { if (this.p) this.p.pauseVideo(); }
}
const yt = new YTMedia();
let M = vid;  // 今の動画（<video> か YouTube の埋め込み）
const on = (ev, fn) => { vid.addEventListener(ev, fn); yt.addEventListener(ev, fn); };
const v = vid;  // <video> そのもの（落としたファイル用）
let state = null;

const post = (name, body = {}) =>
  fetch(`/api/${name}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).catch(() => {});

const fmt = (s) => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = String(s % 60).padStart(2, "0");
  return h ? `${h}:${String(m).padStart(2, "0")}:${ss}` : `${m}:${ss}`;
};
const thumb = (video) => video.thumb || (/^[\w-]{11}$/.test(video.id || "") ? `https://i.ytimg.com/vi/${video.id}/mqdefault.jpg` : "");
const MEDIA_LABEL = { ready: "✓ 準備できた", loading: "⬇ 落としています…", error: "✗ 落とせなかった", "": "" };
const dubLabel = (ds) => !ds ? "" : ds.st === "ready" ? "🗣 吹き替えあり" : ds.st === "partial" ? `🗣 途中まで吹き替えあり（${ds.msg || ""}）`
  : ds.st === "working" ? `🗣 吹き替えを作っています ${ds.msg || ""}`
  : ds.st === "checking" ? "🗣 言語を確かめています" : ds.st === "error" ? "🗣 吹き替えに失敗" : "";

function itemEl(video, i, isNow) {
  const b = document.createElement("button");
  b.className = "item" + (isNow ? " now" : "");
  const st = (state.media || {})[video.key] || "";
  const img = thumb(video);
  b.innerHTML = `<div class="thumb">${img ? `<img loading="lazy" alt="">` : ""}<span class="dur"></span></div>
    <div class="meta"><div class="t"></div><div class="c"></div><div class="s ${st}"></div></div>`;
  if (img) b.querySelector("img").src = img;
  b.querySelector(".dur").textContent = video.duration ? fmt(video.duration) : "";
  if (!video.duration) b.querySelector(".dur").remove();
  b.querySelector(".t").textContent = (isNow ? "▶ " : "") + video.title;
  b.querySelector(".c").textContent = video.channel || "";
  const ds = (state.dub || {})[video.id];  // 吹き替え（英語の動画）の状態も並べる
  b.querySelector(".s").textContent = [MEDIA_LABEL[st] || "", dubLabel(ds)].filter(Boolean).join("　");
  b.title = video.reason || "";
  if (!isNow) b.onclick = () => post("play", { index: i });
  return b;
}

function render() {
  const s = state;
  const list = $("list");
  list.replaceChildren(...[
    ...(s.now ? [itemEl(s.now, -1, true)] : []),
    ...s.queue.map((q, i) => itemEl(q, i, false)),
  ]);
  $("status").textContent = s.status || "";
  $("title").textContent = s.now ? s.now.title : "—";
  // 吹き替え（英語の動画、web.py の Dubber）：できていれば重ねる。作っている間は進み具合を出す
  const ds = s.now ? (s.dub || {})[s.now.id] : null;
  $("chan").textContent = s.now ? (s.now.channel || "") + (ds && ds.st === "ready" ? "　🗣 吹き替え"
    : ds && ds.st === "partial" ? `　🗣 吹き替え（途中まで、${ds.msg}）`
    : ds && ds.st === "working" ? `　🗣 吹き替えを作っています（${ds.msg}）` : ds && ds.st === "checking" ? "　🗣 言語を確かめています" : "") : "";
  document.title = s.now ? `▶ ${s.now.title} - autotube プレーヤー` : "autotube プレーヤー";  // F7（f7-switch）が窓のタイトルで見分ける

  // 再生する動画
  const key = s.now && s.now.key;
  const st = key ? (s.media || {})[key] : "";
  const veil = $("veil");
  if (!s.now) {
    veil.textContent = s.picking ? "動画を選んでいます…" : "希望をリモコンで入れて「スタート」すると、ここで再生します";
    veil.classList.remove("hidden");
    if (v.dataset.key) { v.pause(); v.removeAttribute("src"); v.load(); v.dataset.key = ""; }
    if ($("emb").dataset.src) { $("emb").removeAttribute("src"); $("emb").dataset.src = ""; $("emb").hidden = true; }
    if (yt.id) { yt.stop(); $("ytbox").hidden = true; }
    return;
  }
  // YouTube：埋め込みのプレーヤーで流す（吹き替えは M＝yt に合わせて重ねる）
  if (s.now.yt) {
    veil.classList.add("hidden");
    if (v.dataset.key) { v.pause(); v.removeAttribute("src"); v.load(); v.dataset.key = ""; }
    v.classList.add("off");
    if ($("emb").dataset.src) { $("emb").removeAttribute("src"); $("emb").dataset.src = ""; $("emb").hidden = true; }
    $("ytbox").hidden = false;
    M = yt;
    if (yt.id !== s.now.yt) { dubStop(); yt.load(s.now.yt); }
    setDub(s.now.id, ds ? ds.st : "");
    dubCovered = ds && ds.st === "ready" ? Infinity : ds && ds.st === "partial" ? (ds.covered || 0) : 0;
    return;
  }
  if (yt.id) { yt.stop(); $("ytbox").hidden = true; }
  M = vid;
  // 埋め込むもの：動画を止めて隠し、iframe にページを入れる（F9 は拡張機能が中の動画を画面いっぱいにする）
  const emb = $("emb");
  if (s.now.embed) {
    veil.classList.add("hidden");
    if (v.dataset.key) { v.pause(); v.removeAttribute("src"); v.load(); v.dataset.key = ""; }
    v.classList.add("off");
    if (emb.dataset.src !== s.now.embed) { emb.dataset.src = s.now.embed; emb.src = s.now.embed; }
    emb.hidden = false;
    return;
  }
  if (emb.dataset.src) { emb.removeAttribute("src"); emb.dataset.src = ""; }
  emb.hidden = true;
  v.classList.remove("off");
  setDub(s.now.id, st === "ready" && ds ? ds.st : "");
  dubCovered = ds && ds.st === "ready" ? Infinity : ds && ds.st === "partial" ? (ds.covered || 0) : 0;
  if (st === "ready") {
    veil.classList.add("hidden");
    if (v.dataset.key !== key) {
      v.dataset.key = key;
      v.src = `/media/${encodeURIComponent(key)}`;
      startPlay();
    }
  } else {
    veil.textContent = st === "error" ? "この動画は落とせませんでした（⏭ 次へ）" : `「${s.now.title}」を落としています…`;
    veil.classList.remove("hidden");
    if (v.dataset.key && v.dataset.key !== key) { v.pause(); v.removeAttribute("src"); v.load(); v.dataset.key = ""; }
  }
}

// 音つきの自動再生をブラウザに止められたら、音を消して再生し、押せば音を出せるようにする
async function startPlay() {
  try {
    await v.play();
  } catch (e) {
    v.muted = true;
    $("unmute").hidden = false;
    v.play().catch(() => {});
  }
}
$("unmute").onclick = () => { v.muted = false; $("unmute").hidden = true; audio(); v.play().catch(() => {}); };
v.addEventListener("volumechange", () => { if (!v.muted) $("unmute").hidden = true; });

// 吹き替えの音：映像の位置に合わせて流す（止める・飛ばす・速さにもついていく）。元の音は DUB_ORIG 倍に下げる
// 吹き替え：台本（/script/ID：時刻・配役・声・訳）だけを持ち、流しながら /tts（VOICEVOX）で声にして Web Audio で時刻どおりに鳴らす。
// 先の LOOKAHEAD 秒を先回り。止める・飛ばす・速さにもついていく。途中までの台本（partial）は 15 秒ごとに読み直して続きを足す。
// 元の音は DUB_ORIG 倍に下げる。日本語の字幕も出す
const DUB_ORIG = 0.25, LOOKAHEAD = 8, VOICE = { M: 13, F: 3 };
let dubCovered = 0;  // 吹き替えがあるところ（秒、全部なら Infinity）。下の細いバーで青く出す
setInterval(() => {
  const d = M.duration || 0;
  $("pbFill").style.width = d ? Math.min(100, M.currentTime / d * 100) + "%" : "0";
  $("pbHead").style.left = d ? `calc(${Math.min(100, M.currentTime / d * 100)}% - 1px)` : "0";
  $("pbDub").style.width = d && dubKey ? Math.min(100, dubCovered / d * 100) + "%" : "0";
}, 500);
let dubKey = "", dubLines = [], dubPartial = false, dubFetchAt = 0, baseVol = 1, actx = null, gain = null;
const dubCache = new Map(), dubSched = new Map();
function applyVol() {
  M.volume = baseVol * (dubKey && dubLines.length ? DUB_ORIG : 1);
  if (gain) gain.gain.value = M.muted ? 0 : baseVol;
}
function audio() {  // 音を鳴らす準備（ブラウザは操作のあとでないと鳴らさせないので、再生や「音を出す」のときに作る・再開する）
  if (!actx) { actx = new AudioContext(); gain = actx.createGain(); gain.connect(actx.destination); applyVol(); }
  if (actx.state === "suspended") actx.resume().catch(() => {});
  return actx;
}
async function loadScript() {
  const key = dubKey;
  dubFetchAt = Date.now();
  try {
    const r = await fetch(`/script/${encodeURIComponent(key)}`);
    if (r.ok && key === dubKey) { const d = await r.json(); dubLines = d.lines || []; applyVol(); }
  } catch (e) {}
}
function dubStop() { for (const x of dubSched.values()) { try { x && x.stop(); } catch (e) {} } dubSched.clear(); }
function setDub(key, st) {
  const on = st === "ready" || st === "partial";
  if (on && dubKey !== key) { dubStop(); dubCache.clear(); dubKey = key; dubLines = []; loadScript(); }
  else if (!on && dubKey) { dubStop(); dubCache.clear(); dubKey = ""; dubLines = []; $("dsub").textContent = ""; }
  if (on && dubPartial && st === "ready") loadScript();  // 途中から全部できた
  dubPartial = st === "partial";
  applyVol();
}
setInterval(() => { if (dubKey && dubPartial && Date.now() - dubFetchAt > 15000) loadScript(); }, 3000);
const room = (i) => Math.max(0.8, (dubLines[i + 1] ? dubLines[i + 1].t : dubLines[i].end + 3) - dubLines[i].t);
async function voice(text, sp, speed, pitch) {
  const r = await fetch(`/tts?text=${encodeURIComponent(text)}&sp=${sp}&speed=${speed}&pitch=${pitch}`);
  if (!r.ok) throw new Error(await r.text());
  return audio().decodeAudioData(await r.arrayBuffer());
}
function synth(i) {
  const L = dubLines[i], k = `${dubKey}:${L.t}`;
  if (!dubCache.has(k)) {
    dubCache.set(k, (async () => {
      const vc = Array.isArray(L.voice) ? L.voice : [L.voice || VOICE[L.sp] || VOICE.M, 0];
      let speed = 1.15, buf = await voice(L.ja, vc[0], speed, vc[1] || 0);
      if (buf.duration > room(i)) {  // 次の文までに収まらなければ速く読み直す（2 倍まで）
        speed = Math.min(2, speed * buf.duration / room(i) * 1.05);
        buf = await voice(L.ja, vc[0], speed, vc[1] || 0);
      }
      return buf;
    })());
    dubCache.get(k).catch(() => dubCache.delete(k));
  }
  return dubCache.get(k);
}
function dubTick() {
  if (!dubKey || !dubLines.length || M.paused || M.seeking || !actx) return;
  const now = M.currentTime, key = dubKey;
  for (let i = 0; i < dubLines.length; i++) {
    const L = dubLines[i];
    if (L.t > now + LOOKAHEAD) break;
    const k = `${key}:${L.t}`;
    if (L.t + room(i) < now || dubSched.has(k)) continue;
    dubSched.set(k, null);
    synth(i).then((buf) => {
      if (key !== dubKey || !dubSched.has(k) || dubSched.get(k) || M.paused) return;
      const off = M.currentTime - L.t;
      if (off >= buf.duration) return;
      const src = actx.createBufferSource();
      src.buffer = buf; src.playbackRate.value = M.playbackRate; src.connect(gain);
      if (off < 0) src.start(actx.currentTime - off / M.playbackRate); else src.start(0, off);
      dubSched.set(k, src);
    }).catch(() => { dubSched.delete(k); });
  }
}
setInterval(dubTick, 250);
for (const ev of ["seeking", "pause", "ratechange", "emptied"]) on(ev, dubStop);
for (const ev of ["seeked", "play", "ratechange"]) on(ev, () => { if (dubKey) audio(); setTimeout(dubTick, 0); });
on("volumechange", applyVol);
on("timeupdate", () => {  // 吹き替えの字幕（今の文）
  if (!dubKey) return;
  const now = M.currentTime;
  const i = dubLines.findIndex((L, k) => L.t <= now && now < L.t + Math.min(room(k), Math.max(2.5, L.end - L.t + 1)));
  $("dsub").textContent = i >= 0 ? dubLines[i].ja : "";
});

on("ended", () => post("next"));
// YouTube の埋め込みが断られた（101・150＝埋め込み禁止など）→ 落として流す
yt.addEventListener("error", (e) => post("ytfail", { code: e.detail }));
v.addEventListener("error", () => { if (v.dataset.key) $("veil").textContent = "再生できませんでした（⏭ 次へ）"; });
let lastPos = 0;
const sendPos = () => post("webpos", { pos: M.currentTime, dur: M.duration || 0, paused: M.paused, muted: M.muted, volume: baseVol });
on("timeupdate", () => { if (Date.now() - lastPos > 2000) { lastPos = Date.now(); sendPos(); } $("pos").textContent = `${fmt(M.currentTime)} / ${fmt(M.duration)}`; });
on("pause", sendPos);
on("play", sendPos);
v.addEventListener("click", () => (M.paused ? M.play() : M.pause()));

$("next").onclick = () => post("next");
$("mpv").onclick = async () => { M.pause(); await post("web", { on: false }); location.href = "/"; };

// リモコンからの操作（web.py の ctl。番号が増えたら実行。開いた時点の番号は実行しない）
let lastCtl = null;
function applyCtl(c) {
  if (!c || lastCtl === null) { lastCtl = c ? c.id : 0; return; }
  if (c.id <= lastCtl) return;
  lastCtl = c.id;
  if (!v.dataset.key && !yt.id) return;
  if (c.cmd === "pause") M.paused ? M.play().catch(() => {}) : M.pause();
  else if (c.cmd === "seek") M.currentTime = Math.max(0, Math.min(M.duration || Infinity, M.currentTime + Number(c.arg || 0)));
  else if (c.cmd === "volume") { baseVol = Math.max(0, Math.min(1, Number(c.arg) / 100)); M.muted = false; applyVol(); }
  else if (c.cmd === "mute") M.muted = !M.muted;
  sendPos();
}

// 全画面のままほかのタブへ移ると、ブラウザが全画面を解く。戻ってきたら全画面に戻す（ページからは全画面にできないので、
// web.py に本物の F9 キーを送ってもらう）。自分で F9・Esc で解いたときは戻さない
let wantFs = false;
document.addEventListener("fullscreenchange", () => {
  if (document.fullscreenElement) { wantFs = true; return; }
  setTimeout(() => { if (!document.hidden) wantFs = false; }, 400);  // 400ms 後も見えている＝自分で解いた
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden && wantFs && !document.fullscreenElement) setTimeout(() => {
    if (!document.hidden && !document.fullscreenElement) post("fullscreen");
  }, 600);
});

function connect() {
  const es = new EventSource("/events");
  // つながるたびにブラウザで再生するモードにする（web.py を起動し直したあとも、このページが開いていればこのモードに戻る）
  es.onopen = () => post("web", { on: true });
  es.onmessage = (e) => { state = JSON.parse(e.data); applyCtl(state.ctl); render(); };
  es.onerror = () => { es.close(); setTimeout(connect, 2000); };
}
// このページを開いたら、ブラウザで再生するモードにする
post("web", { on: true }).then(() => fetch("/api/state")).then((r) => r.json()).then((s) => { state = s; applyCtl(s.ctl); render(); connect(); });
</script>
</body>
