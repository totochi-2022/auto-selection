<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>autotube</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --panel2: #222933; --line: #2e3742;
    --text: #e8ecf1; --muted: #8d99a8; --accent: #4fa3ff; --accent-ink: #06121f;
    --good: #3ecf8e; --bad: #ff6b6b; --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5; --line: #d9dee5;
      --text: #18202a; --muted: #5d6b7c; --accent: #1f6fd1; --accent-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  .status { color: var(--muted); font-size: 13px; text-align: right; overflow-wrap: anywhere; }
  .status.busy::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
    border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate;
  }
  @keyframes pulse { from { opacity: .25 } to { opacity: 1 } }
  /* 選んでいる間は、進み具合を画面の上に固定して大きめに出す */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg, #111); padding: 6px 0; }
  .status.busy { color: var(--accent); font-size: 15px; font-weight: 600; }
  .qbusy { color: var(--accent); font-size: 14px; margin: -2px 0 8px; }
  .qbusy::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
    border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate;
  }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; letter-spacing: .04em; }

  /* 再生中 */
  .now { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: start; }
  .now img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--panel2); }
  .now .title { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .reason { font-size: 13px; margin-top: 4px; }
  .empty { color: var(--muted); }
  .progress { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; cursor: pointer; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .4s linear; }
  .controls { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin-top: 12px; }
  button {
    font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 6px; cursor: pointer; min-height: 44px;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .controls button { font-size: 18px; }
  .controls small { display: block; font-size: 10px; color: var(--muted); }
  .volume { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .volume button { min-height: 40px; padding: 6px 14px; font-size: 18px; }
  .volume input { flex: 1; accent-color: var(--accent); height: 28px; }
  .volume output { width: 3ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

  /* 希望と条件 */
  form { display: grid; gap: 10px; }
  textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; min-height: 64px;
  }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts label {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line); cursor: pointer; user-select: none; font-size: 14px;
  }
  .opts input { accent-color: var(--accent); }
  .queries { font-size: 12px; color: var(--muted); }

  /* ネクスト */
  .qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .qhead h2 { margin: 0; }
  .qhead button { padding: 6px 12px; min-height: 0; font-size: 13px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { display: grid; grid-template-columns: 112px 1fr auto; gap: 10px; align-items: start; }
  li img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--panel2); }
  li .title { font-size: 14px; font-weight: 600; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  li .reason { color: var(--muted); font-size: 12px; margin-top: 2px; }
  li .acts { display: grid; gap: 6px; }
  li .acts button { padding: 6px 10px; min-height: 36px; font-size: 14px; }
  .live { color: var(--bad); font-weight: 600; }
  .chmode { font-size: 13px; color: var(--accent); margin: -4px 0 10px; }

  @media (max-width: 480px) {
    .now { grid-template-columns: 1fr; }
    li { grid-template-columns: 88px 1fr auto; }
    .controls { grid-template-columns: repeat(4, 1fr); }  /* スマホでは 2 段に */
    .controls button { font-size: 16px; padding: 8px 2px; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>autotube</h1>
    <div class="status" id="status">接続中…</div>
  </header>

  <section>
    <h2>再生中</h2>
    <div id="now" class="empty">まだ何も再生していません</div>
    <div class="progress">
      <span id="pos">0:00</span>
      <div class="bar" id="bar" title="クリックでその位置へ"><div id="barFill"></div></div>
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button data-act="seek" data-sec="-30" title="30秒戻る">⏪<small>-30秒</small></button>
      <button data-act="pause" id="pauseBtn" title="一時停止 / 再生">⏯<small>一時停止</small></button>
      <button data-act="next" title="次の動画へ">⏭<small>次へ</small></button>
      <button data-act="mute" id="muteBtn" title="ミュート">🔊<small>ミュート</small></button>
      <button data-act="max" id="maxBtn" title="最大化の切り替え">⛶<small>最大化</small></button>
      <button data-act="rate" data-ev="good" title="好き">👍<small>好き</small></button>
      <button data-act="rate" data-ev="bad" title="いまいち">👎<small>いまいち</small></button>
      <button data-act="channel" id="chBtn" title="気に入ったら：次の候補をこの動画のチャンネルから選ぶ">📺<small>このチャンネル</small></button>
    </div>
    <div class="volume">
      <button data-act="volume" data-delta="-5" title="音量を下げる">−</button>
      <input type="range" id="vol" min="0" max="100" step="1" value="100" aria-label="音量">
      <button data-act="volume" data-delta="5" title="音量を上げる">＋</button>
      <output id="volVal">100</output>
    </div>
    <div class="opts" style="margin-top:10px">
      <label title="720p より大きい動画は 720p で再生する（カクつくとき用）"><input type="checkbox" id="optQ720"> 画質を720pまでにする</label>
    </div>
  </section>

  <section>
    <h2>観たいもの</h2>
    <form id="form">
      <textarea id="request" placeholder="例：将棋　いつもと違う感じで、棋士の素顔がわかるような"></textarea>
      <div class="opts">
        <label><input type="checkbox" id="optLive"> ライブを含む</label>
        <label><input type="checkbox" id="optLong"> 長時間（10時間超）も含む</label>
        <label><input type="checkbox" id="optNewest"> 最新動画を優先</label>
        <label title="お手本の動画やチャンネルを書く">探し方
          <select id="optMode">
            <option value="normal">普通</option>
            <option value="similar">似たもの（〇〇みたいな）</option>
            <option value="web">ネットの記事から（遅い）</option>
          </select></label>
        <label title="候補 20 本の字幕を読ませて、中身のしっかりした動画を選ぶ"><input type="checkbox" id="optSubs"> 字幕を読んで選ぶ（遅い）</label>
      </div>
      <div class="queries" id="queries"></div>
      <button class="primary" type="submit">スタート</button>
    </form>
  </section>

  <section>
    <div class="qhead">
      <h2>ネクスト</h2>
      <div>
        <button data-act="reshuffle" title="キューを捨てて選び直す">選び直す</button>
        <button data-act="stop" title="再生を止める">停止</button>
        <button data-act="quit" title="再生アプリ（mpv）を終了してメモリを空ける">終了</button>
      </div>
    </div>
    <div id="qbusy" class="qbusy"></div>
    <div id="chmode" class="chmode"></div>
    <ol id="queue"></ol>
    <div id="queueEmpty" class="empty">まだありません</div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t") || "";  // 合言葉（phone-input と共通）
let state = null;
let formTouched = false;

const fmt = (sec) => {
  if (!sec) return "0:00";
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
};
const dur = (sec) => sec ? fmt(sec) : '<span class="live">● ライブ</span>';
const thumb = (id) => `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

async function api(name, body = {}) {
  try {
    await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": token }, body: JSON.stringify(body) });
  } catch (e) {
    $("status").textContent = "サーバーに届きませんでした";
  }
}

function render(s) {
  state = s;
  const st = $("status");
  st.textContent = s.status;
  st.classList.toggle("busy", s.picking);
  $("qbusy").textContent = s.picking ? s.status : "";
  $("qbusy").style.display = s.picking ? "" : "none";

  const n = s.now;
  $("now").className = n ? "now" : "empty";
  $("now").innerHTML = n ? `
    <img src="${thumb(n.id)}" alt="">
    <div>
      <div class="title">${esc(n.title)}</div>
      <div class="meta">${esc(n.channel || "")} ／ ${dur(n.duration)}</div>
      ${n.reason ? `<div class="reason">💬 ${esc(n.reason)}</div>` : ""}
    </div>` : (s.picking ? "選んでいます…" : "まだ何も再生していません");

  const p = s.player;
  $("pos").textContent = fmt(p.pos);
  $("dur").textContent = p.dur ? fmt(p.dur) : (n && !n.duration ? "ライブ" : "0:00");
  $("barFill").style.width = p.dur ? Math.min(100, p.pos / p.dur * 100) + "%" : "0";
  $("pauseBtn").classList.toggle("on", p.paused);
  $("pauseBtn").querySelector("small").textContent = p.paused ? "再生" : "一時停止";
  if (!volDragging) { $("vol").value = p.volume; }
  $("volVal").textContent = volDragging ? $("vol").value : p.volume;
  for (const el of document.querySelectorAll(".volume button, #vol")) el.disabled = !n || !p.running;
  $("muteBtn").classList.toggle("on", p.muted);
  $("muteBtn").firstChild.textContent = p.muted ? "🔇" : "🔊";
  $("muteBtn").querySelector("small").textContent = p.muted ? "解除" : "ミュート";
  $("maxBtn").classList.toggle("on", p.maximized);
  $("maxBtn").querySelector("small").textContent = p.maximized ? "元に戻す" : "最大化";
  for (const b of document.querySelectorAll(".controls button")) b.disabled = !n || !p.running;
  $("optQ720").checked = s.q720;
  const ch = s.channel;
  $("chBtn").classList.toggle("on", !!ch);
  $("chBtn").querySelector("small").textContent = ch ? "解除" : "このチャンネル";
  $("chBtn").dataset.on = ch ? "0" : "1";
  if (ch) $("chBtn").disabled = false;  // 停止中でも解除はできるように
  $("chmode").textContent = ch ? `📺 チャンネル「${ch.name}」から選んでいます` : "";
  $("chmode").style.display = ch ? "" : "none";

  if (!formTouched) {
    $("request").value = s.request;
    $("optLive").checked = s.opts.live;
    $("optLong").checked = s.opts.long;
    $("optNewest").checked = s.opts.newest;
    $("optMode").value = s.opts.mode || "normal";
    $("optSubs").checked = !!s.opts.subs;
  }
  $("queries").textContent = s.queries.length
    ? ({ music: "🎵 音楽として探しています　", channel: "📺 チャンネルから探しています　" }[s.kind] || "")
      + (s.filters ? "【" + s.filters + "】 " : "")
      + (s.traits ? "（基準: " + s.traits + "） " : "")
      + "検索ワード: " + s.queries.join(" / ") + (s.claude_live && !s.opts.live ? "（Claude の判断でライブも含む）" : "")
    : "";

  $("queue").innerHTML = s.queue.map((v, i) => `
    <li>
      <img src="${thumb(v.id)}" alt="" loading="lazy">
      <div>
        <div class="title">${esc(v.title)}</div>
        <div class="meta">${esc(v.channel || "")} ／ ${dur(v.duration)}</div>
        ${v.reason ? `<div class="reason">${esc(v.reason)}</div>` : ""}
      </div>
      <div class="acts">
        <button data-act="play" data-index="${i}" title="今すぐ再生">▶</button>
        <button data-act="drop" data-index="${i}" title="キューから外す">✕</button>
      </div>
    </li>`).join("");
  $("queueEmpty").style.display = s.queue.length ? "none" : "";
  $("queueEmpty").textContent = s.picking ? "選んでいます…" : "まだありません";
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const body = {};
  if (b.dataset.index !== undefined) body.index = Number(b.dataset.index);
  if (b.dataset.sec !== undefined) body.sec = Number(b.dataset.sec);
  if (b.dataset.ev !== undefined) body.ev = b.dataset.ev;
  if (b.dataset.delta !== undefined) body.delta = Number(b.dataset.delta);
  if (b.dataset.on !== undefined) body.on = b.dataset.on === "1";
  api(b.dataset.act, body);
});

$("bar").addEventListener("click", (e) => {
  if (!state || !state.player.dur) return;
  const r = e.currentTarget.getBoundingClientRect();
  const target = (e.clientX - r.left) / r.width * state.player.dur;
  api("seek", { sec: target - state.player.pos });
});

// 音量スライダー：動かしている間は 150ms ごとにまとめて送る
let volDragging = false, volTimer = null;
$("vol").addEventListener("input", () => {
  volDragging = true;
  $("volVal").textContent = $("vol").value;
  if (!volTimer) volTimer = setTimeout(() => { volTimer = null; api("volume", { vol: Number($("vol").value) }); }, 150);
});
$("vol").addEventListener("change", () => {
  clearTimeout(volTimer); volTimer = null;
  api("volume", { vol: Number($("vol").value) });
  volDragging = false;
});

$("optQ720").addEventListener("change", (e) => api("q720", { on: e.target.checked }));

for (const id of ["request", "optLive", "optLong", "optNewest", "optMode", "optSubs"]) {
  $(id).addEventListener("input", () => { formTouched = true; });
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const request = $("request").value.trim();
  if (!request) return $("request").focus();
  formTouched = false;
  api("start", { request, opts: { live: $("optLive").checked, long: $("optLong").checked, newest: $("optNewest").checked,
                          mode: $("optMode").value, subs: $("optSubs").checked } });
});
$("request").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("form").requestSubmit();
});

function connect() {
  const es = new EventSource("/events?t=" + encodeURIComponent(token));
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = () => { $("status").textContent = "再接続中…"; };
}
connect();
</script>
</body>
</html>
