<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>autotube</title>
<style>
  :root {
    --bg: #111418; --panel: #1a1f26; --panel2: #222933; --line: #2e3742;
    --text: #e8ecf1; --muted: #8d99a8; --accent: #4fa3ff; --accent-ink: #06121f;
    --good: #3ecf8e; --bad: #ff6b6b; --radius: 12px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f9; --panel: #ffffff; --panel2: #eef1f5; --line: #d9dee5;
      --text: #18202a; --muted: #5d6b7c; --accent: #1f6fd1; --accent-ink: #ffffff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; display: grid; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .02em; }
  .status { color: var(--muted); font-size: 13px; text-align: right; overflow-wrap: anywhere; }
  .status.busy::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
    border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate;
  }
  @keyframes pulse { from { opacity: .25 } to { opacity: 1 } }
  /* 選んでいる間は、進み具合を画面の上に固定して大きめに出す */
  header { position: sticky; top: 0; z-index: 5; background: var(--bg, #111); padding: 6px 0; }
  .status.busy { color: var(--accent); font-size: 15px; font-weight: 600; }
  .qbusy { color: var(--accent); font-size: 14px; margin: -2px 0 8px; }
  .qbusy::before {
    content: ""; display: inline-block; width: 8px; height: 8px; margin-right: 6px;
    border-radius: 50%; background: var(--accent); animation: pulse 1s infinite alternate;
  }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; letter-spacing: .04em; }

  /* 再生中 */
  .now { display: grid; grid-template-columns: 160px 1fr; gap: 12px; align-items: start; }
  .now img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--panel2); }
  .now .title { font-weight: 600; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; }
  .reason { font-size: 13px; margin-top: 4px; }
  .empty { color: var(--muted); }
  .progress { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 6px; background: var(--panel2); border-radius: 3px; overflow: hidden; cursor: pointer; }
  .bar { position: relative; height: 10px; }
  .bar > div { position: absolute; left: 0; top: 0; height: 100%; background: var(--accent); width: 0; transition: width .4s linear; }
  .bar > #barDub { top: auto; bottom: 0; height: 3px; background: #3fb950; }  /* 吹き替えがあるところ：下に細く緑 */
  .bar > #barHead { width: 2px; background: #fff; transition: left .4s linear; }  /* 今の位置 */
  .controls { display: grid; grid-template-columns: repeat(10, 1fr); gap: 8px; margin-top: 12px; }
  button {
    font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 6px; cursor: pointer; min-height: 44px;
  }
  button:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.on { border-color: var(--accent); color: var(--accent); }
  .controls button { font-size: 18px; }
  .controls small { display: block; font-size: 10px; color: var(--muted); }
  .volume { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
  .volume button { min-height: 40px; padding: 6px 14px; font-size: 18px; }
  .volume input { flex: 1; accent-color: var(--accent); height: 28px; }
  .volume output { width: 3ch; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }

  /* 希望と条件 */
  form { display: grid; gap: 10px; }
  textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--panel2);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px; resize: vertical; min-height: 64px;
  }
  textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts label {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px;
    background: var(--panel2); border: 1px solid var(--line); cursor: pointer; user-select: none; font-size: 14px;
  }
  .opts input { accent-color: var(--accent); }
  .queries { font-size: 12px; color: var(--muted); }

  /* ネクスト */
  .qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .qhead h2 { margin: 0; }
  .qhead button { padding: 6px 12px; min-height: 0; font-size: 13px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  li { display: grid; grid-template-columns: 112px 1fr auto; gap: 10px; align-items: start; }
  li img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 6px; background: var(--panel2); }
  li .title { font-size: 14px; font-weight: 600; overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  li .reason { color: var(--muted); font-size: 12px; margin-top: 2px; }
  li .acts { display: grid; gap: 6px; }
  li .acts button { padding: 6px 10px; min-height: 36px; font-size: 14px; }
  .live { color: var(--bad); font-weight: 600; }
  /* リスト：左の ≡ を押さえて上下に動かすと順番が変わる */
  #queue li { grid-template-columns: 22px 100px 1fr auto; }
  #queue .grip { align-self: center; font-size: 20px; color: var(--muted); text-align: center; touch-action: none; cursor: grab; user-select: none; }
  #queue li.dragging { opacity: .6; outline: 2px dashed var(--accent); border-radius: 8px; }
  .webthumb { display: grid; place-items: center; aspect-ratio: 16/9; border-radius: 6px; background: var(--panel2); font-size: 28px; }
  .addrow { display: flex; gap: 6px; margin: 0 0 10px; }
  .addrow input { flex: 1; min-width: 0; }
  .autorow { display: flex; align-items: center; gap: 8px; font-size: 14px; margin: 0 0 8px; }
  #hist li { grid-template-columns: 100px 1fr auto; }
  #histBox summary { cursor: pointer; font-weight: 600; }
  .chmode { font-size: 13px; color: var(--accent); margin: -4px 0 10px; }

  @media (max-width: 480px) {
    .now { grid-template-columns: 1fr; }
    li { grid-template-columns: 88px 1fr auto; }
    .controls { grid-template-columns: repeat(5, 1fr); }  /* スマホでは 2 段に */
    .controls button { font-size: 16px; padding: 8px 2px; }
  }

  /* 横画面（PC・テレビ・スマホ横向き）：左に再生中と希望、右にネクスト。幅で自動に切り替わる */
  @media (min-width: 960px), (orientation: landscape) and (min-width: 640px) {
    main {
      max-width: 1400px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-areas: "head head" "now next" "form next"; align-items: start;
    }
    header { grid-area: head; }
    main > section:nth-of-type(1) { grid-area: now; }
    main > section:nth-of-type(2) { grid-area: form; }
    main > section:nth-of-type(3) { grid-area: next; position: sticky; top: 48px; max-height: calc(100vh - 60px); overflow-y: auto; }
    .now { grid-template-columns: 200px 1fr; }
  }
  /* 横向きでも狭いとき（スマホ横向き）は詰める */
  @media (orientation: landscape) and (max-height: 500px) {
    main { padding: 8px 12px 16px; gap: 10px; }
    section { padding: 10px; }
    .now { grid-template-columns: 140px 1fr; }
    .controls button { font-size: 16px; padding: 6px 2px; min-height: 38px; }
    li { grid-template-columns: 88px 1fr auto; }
  }
  .dubok { color: #5aa0ff; font-weight: bold; }
</style>
</head>
<body>
<main>
  <header>
    <h1>autotube</h1>
    <div class="status" id="status">接続中…</div>
  </header>

  <section>
    <h2>再生中</h2>
    <div id="now" class="empty">まだ何も再生していません</div>
    <div class="progress">
      <span id="pos">0:00</span>
      <div class="bar" id="bar" title="クリックでその位置へ（下の緑のところまで吹き替えあり、白い線が今の位置）"><div id="barFill"></div><div id="barDub"></div><div id="barHead"></div></div>
      <span id="dur">0:00</span>
    </div>
    <div class="controls">
      <button data-act="show" id="showBtn" hidden title="テレビの画面を動画（mpv かプレーヤーのタブ）に切り替え、ほかのタブの動画は一時停止">📺<small>動画を前に</small></button>
      <button data-act="seek" data-sec="-30" title="30秒戻る">⏪<small>-30秒</small></button>
      <button data-act="pause" id="pauseBtn" title="一時停止 / 再生">⏯<small>一時停止</small></button>
      <button data-act="next" title="次の動画へ">⏭<small>次へ</small></button>
      <button data-act="mute" id="muteBtn" title="ミュート">🔊<small>ミュート</small></button>
      <button data-act="max" id="maxBtn" title="最大化の切り替え">⛶<small>最大化</small></button>
      <button data-act="rate" data-ev="good" title="好き">👍<small>好き</small></button>
      <button data-act="rate" data-ev="bad" title="いまいち">👎<small>いまいち</small></button>
      <button data-act="radio" id="radioBtn" title="この曲を起点にしたラジオ（似た曲を自動で並べたもの）から次を選ぶ">📻<small>ラジオ</small></button>
      <button data-act="channel" id="chBtn" title="気に入ったら：次の候補をこの動画のチャンネルから選ぶ">📺<small>このチャンネル</small></button>
      <button data-act="browser" title="この動画を YouTube のページで開く（コメント・概要欄を見る）。mpv は一時停止">💬<small>YouTube で開く</small></button>
    </div>
    <div class="volume">
      <button data-act="volume" data-delta="-5" title="音量を下げる">−</button>
      <input type="range" id="vol" min="0" max="100" step="1" value="100" aria-label="音量">
      <button data-act="volume" data-delta="5" title="音量を上げる">＋</button>
      <output id="volVal">100</output>
    </div>
    <div class="opts" style="margin-top:10px">
      <label title="720p より大きい動画は 720p で再生する（カクつくとき用）"><input type="checkbox" id="optQ720"> 画質を720pまでにする</label>
    </div>
  </section>


  <section>
    <h2>観たいもの</h2>
    <form id="form" autocomplete="off">
      <textarea id="request" placeholder="例：将棋　いつもと違う感じで、棋士の素顔がわかるような"></textarea>
      <div class="opts">
        <label><input type="checkbox" id="optLive"> ライブを含む</label>
        <label><input type="checkbox" id="optLong"> 長時間（10時間超）も含む</label>
        <label><input type="checkbox" id="optNewest"> 最新動画を優先</label>
        <label title="お手本の動画やチャンネルを書く">探し方
          <select id="optMode">
            <option value="normal">普通</option>
            <option value="similar">似たもの（〇〇みたいな）</option>
            <option value="web">ネットの記事から（遅い）</option>
          </select></label>
        <label title="候補 20 本の字幕を読ませて、中身のしっかりした動画を選ぶ"><input type="checkbox" id="optSubs"> 字幕を読んで選ぶ（遅い）</label>
        <label title="ふだんは日本語の動画だけ。オンにすると外国語（英語・アラビア語・ヘブライ語など）の動画も選び、字幕から日本語に訳してずんだもんたちの声で吹き替える"><input type="checkbox" id="optEn"> 🌐 外国語も（吹き替え）</label>
        <label title="曲そのものが聴ける動画だけを選ぶ（解説・リアクションは外す）。作業用 BGM・メドレーも可"><input type="checkbox" id="optMusic"> 🎵 音楽だけ</label>
        <label title="YouTube Music で曲を探し、その曲のラジオ（似た曲）から選ぶ。音楽だけになる"><input type="checkbox" id="optYtm"> YouTube Music で選ぶ</label>
      </div>
      <div class="queries" id="queries"></div>
      <button class="primary" type="submit">スタート</button>
    </form>
  </section>

  <section>
    <div class="qhead">
      <h2>リスト</h2>
      <div>
        <button data-act="clearq" title="リストを全部外す">全部外す</button>
        <button data-act="reshuffle" title="キューを捨てて選び直す">選び直す</button>
        <button data-act="stop" title="再生を止める">停止</button>
        <button data-act="quit" title="再生アプリ（mpv）を終了してメモリを空ける">終了</button>
      </div>
    </div>
    <label class="autorow" title="オン：リストが減ったら希望に合わせて選んで足す（流し見）。オフ：リストにあるものだけ流して止まる（じっくり見る）">
      <input type="checkbox" id="optAuto"> 自動で足す（流し見）</label>
    <form class="addrow" id="addForm" autocomplete="off">
      <button type="button" id="addPaste" title="スマホのクリップボードの URL を貼る">📋</button>
      <button type="button" id="addPc" title="テレビの PC でコピーした URL を貼る">🖥</button>
      <button type="button" id="addCur" title="テレビの Brave で今見ているタブを貼る">📺</button>
      <input id="addUrl" type="url" placeholder="URL を貼ってリストに足す（アニメのページなども）">
      <button type="submit" data-where="next" title="次に流す">次に</button>
      <button type="submit" data-where="end" class="primary" title="リストの最後に">＋ 最後に</button>
    </form>
    <div id="qbusy" class="qbusy"></div>
    <div id="chmode" class="chmode"></div>
    <ol id="queue"></ol>
    <div id="queueEmpty" class="empty">まだありません</div>
  </section>

  <section>
    <details id="histBox">
      <summary>🕘 履歴（流した動画）</summary>
      <ol id="hist" style="margin-top:10px"></ol>
    </details>
  </section>

  <section>
    <h2>テレビに送る</h2>
    <form id="castForm" class="opts" autocomplete="off">
      <input id="castUrl" type="url" placeholder="動画のページの URL を貼る（YouTube 以外も可）" style="flex:1;min-width:12em">
      <button class="primary" type="submit">📺 送る</button>
    </form>
    <p class="empty" style="text-align:left">
      mpv で再生できないサイト（Netflix など）は、テレビの Brave でページを開きます。<br>
      PC のブラウザ用：このリンクをブックマークバーへドラッグ →
      <a id="bookmarklet" href="#" title="動画のページで押すと、今の再生位置からテレビで続きを再生">📺 テレビで見る</a>
    </p>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const token = new URLSearchParams(location.search).get("t") || "";  // 合言葉（phone-input と共通）
let state = null;
let formTouched = false;
let lastServerForm = null;  // 最後に見たサーバー側のリクエストと選択

const fmt = (sec) => {
  if (!sec) return "0:00";
  sec = Math.floor(sec);
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(s).padStart(2, "0");
};
const dur = (sec) => sec ? fmt(sec) : '<span class="live">● ライブ</span>';
// 長さの欄：Brave で開くもの（アニメのページなど、長さが分からない）は 🌐、ライブと分かっているものだけ「ライブ」
const durOf = (v) => v.duration ? fmt(v.duration) : v.browser && !v.live ? "🌐 Brave で開く" : dur(0);
// サムネイル：YouTube は ID から。それ以外（cast:・web:）は調べたときの画像があればそれ、無ければ 🌐
const isYt = (id) => /^[\w-]{11}$/.test(String(id));
const thumb = (id) => isYt(id) ? `https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg` : "";
const thumbHtml = (v, title = "") => v.thumb || isYt(v.id) ? `<img src="${esc(v.thumb || thumb(v.id))}" alt="" loading="lazy">`
  : `<div class="webthumb"${title ? ` title="${title}"` : ""}>🌐</div>`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// テレビに送る：URL を貼って送る／PC 用のブックマークレット（ページの動画を一時停止して、再生位置ごと送る）
// リスト：自動で足す・URL から足す
$("optAuto").addEventListener("change", () => api("auto", { on: $("optAuto").checked }));
$("addForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const url = $("addUrl").value.trim();
  if (!url) return $("addUrl").focus();
  const title = $("addUrl").dataset.title || "";  // 📺 で入れたときはタブのタイトル（Brave で開くものの名前に）
  api("add", { url, title, where: (e.submitter && e.submitter.dataset.where) || "end" });
  $("addUrl").value = ""; $("addUrl").dataset.title = "";
});

// 📋：クリップボードの文字から URL を取り出して欄に入れる（共有の文のように前後に文字があっても）
$("addPaste").addEventListener("click", async () => {
  try {
    const t = await navigator.clipboard.readText();
    const m = (t || "").match(/https?:\/\/\S+/);
    $("addUrl").value = m ? m[0] : (t || "").trim();
    if (!m) $("status").textContent = "クリップボードに URL がありません";
  } catch (e) {
    $("status").textContent = "クリップボードを読めませんでした（https のページで、読み取りを許可してください）";
    $("addUrl").focus();
  }
});

// 🖥：テレビの PC のクリップボード、📺：テレビの Brave の今のタブ
$("addPc").addEventListener("click", async () => {
  const t = (await (await fetch("/api/pcclip", { headers: { "X-Token": token } })).json()).text || "";
  const m = t.match(/https?:\/\/\S+/);
  if (m) $("addUrl").value = m[0]; else $("status").textContent = "PC のクリップボードに URL がありません";
});
$("addCur").addEventListener("click", async () => {
  const t = await (await fetch("/api/curtab", { headers: { "X-Token": token } })).json();
  if (t && /^https?:/.test(t.url) && !/^https?:\/\/127\.0\.0\.1/.test(t.url)) { $("addUrl").value = t.url; $("addUrl").dataset.title = t.title || ""; }
  else $("status").textContent = "今のタブは足せるページではありません（端末・プレーヤー・新しいタブなど）";
});

// リストの並べ替え：≡ を押さえて上下に。離したところへ動かす（タッチでも動くよう pointer で自前に）
let dragging = null;
$("queue").addEventListener("pointerdown", (e) => {
  const g = e.target.closest(".grip");
  if (!g) return;
  e.preventDefault();
  const li = g.closest("li");
  dragging = { li, from: Number(li.dataset.i) };
  li.classList.add("dragging");
  g.setPointerCapture(e.pointerId);
});
$("queue").addEventListener("pointermove", (e) => {
  if (!dragging) return;
  const items = [...$("queue").children].filter((x) => x !== dragging.li);
  const after = items.find((x) => { const r = x.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
  $("queue").insertBefore(dragging.li, after || null);
});
const dragEnd = () => {
  if (!dragging) return;
  const to = [...$("queue").children].indexOf(dragging.li);
  dragging.li.classList.remove("dragging");
  if (to !== dragging.from && to >= 0) api("move", { from: dragging.from, to });
  dragging = null;
};
$("queue").addEventListener("pointerup", dragEnd);
$("queue").addEventListener("pointercancel", dragEnd);

// 履歴：開いたときに読む。▶ 今すぐ流す・＋ リストの最後に
const ago = (ts) => { const m = Math.round((Date.now() / 1000 - ts) / 60); return m < 60 ? `${m}分前` : m < 1440 ? `${Math.round(m / 60)}時間前` : `${Math.round(m / 1440)}日前`; };
async function loadHist() {
  try {
    const h = await (await fetch("/api/history", { headers: { "X-Token": token } })).json();
    $("hist").innerHTML = h.map((v, i) => `
      <li>
        ${thumbHtml(v)}
        <div><div class="title">${esc(v.title)}</div>
          <div class="meta">${esc(v.channel || "")}${v.duration ? " ／ " + dur(v.duration) : ""} ／ ${ago(v.ts)}</div>
          ${v.request ? `<div class="reason">希望：${esc(v.request)}</div>` : ""}</div>
        <div class="acts">
          <button data-hist="${i}" data-play="1" title="今すぐ流す">▶</button>
          <button data-hist="${i}" title="リストの最後に足す">＋</button>
        </div>
      </li>`).join("") || '<div class="empty">まだありません</div>';
    $("hist").onclick = (e) => {
      const b = e.target.closest("[data-hist]");
      if (!b) return;
      const v = h[Number(b.dataset.hist)];
      api("add", { url: v.url, title: v.title, play: !!b.dataset.play });
      const label = b.dataset.play ? "▶" : "＋";  // 押したしるしは少しだけ。何度でも押せる
      b.textContent = "✓";
      setTimeout(() => { b.textContent = label; }, 1200);
    };
  } catch (e) { $("hist").innerHTML = '<div class="empty">読めませんでした</div>'; }
}
$("histBox").addEventListener("toggle", () => { if ($("histBox").open) loadHist(); });

$("castForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const url = $("castUrl").value.trim();
  if (!url) return $("castUrl").focus();
  api("cast", { url });
  $("castUrl").value = "";
});
$("bookmarklet").href = "javascript:(()=>{const v=document.querySelector('video');const t=v?Math.floor(v.currentTime):0;"
  + "if(v)v.pause();window.open('" + location.origin + "/cast?url='+encodeURIComponent(location.href)+'&t='+t,"
  + "'tv','width=360,height=200')})()";

async function api(name, body = {}) {
  try {
    await fetch("/api/" + name, { method: "POST", headers: { "Content-Type": "application/json", "X-Token": token }, body: JSON.stringify(body) });
  } catch (e) {
    $("status").textContent = "サーバーに届きませんでした";
  }
}

function render(s) {
  state = s;
  const st = $("status");
  st.textContent = s.status;
  st.classList.toggle("busy", s.picking);
  $("qbusy").textContent = s.picking ? s.status : "";
  $("qbusy").style.display = s.picking ? "" : "none";

  const n = s.now;
  $("now").className = n ? "now" : "empty";
  $("now").innerHTML = n ? `
    ${thumbHtml(n)}
    <div>
      <div class="title">${esc(n.title)}</div>
      <div class="meta">${esc(n.channel || "")} ／ ${durOf(n)}</div>
      ${n.reason ? `<div class="reason">💬 ${esc(n.reason)}</div>` : ""}
    </div>` : (s.picking ? "選んでいます…" : "まだ何も再生していません");

  $("showBtn").hidden = !s.can_show;
  // tonzura の mpv は全画面で開くので出さない。ブラウザのプレーヤーでは「動画を画面いっぱいに」（F9）として出す。Pi では出す
  $("maxBtn").hidden = !!s.can_show && !s.web;
  const p = s.player;
  $("pos").textContent = fmt(p.pos);
  $("dur").textContent = p.dur ? fmt(p.dur) : (n && !n.duration ? "ライブ" : "0:00");
  $("barFill").style.width = p.dur ? Math.min(100, p.pos / p.dur * 100) + "%" : "0";
  $("barHead").style.left = p.dur ? `calc(${Math.min(100, p.pos / p.dur * 100)}% - 1px)` : "0";
  // 吹き替えがあるところ（全部できていれば全体、途中までなら訳せたところまで）を青く
  const nd = s.now ? (s.dub || {})[s.now.id] : null;
  $("barDub").style.width = !nd || !p.dur ? "0" : nd.st === "ready" ? "100%" : nd.st === "partial" && nd.covered ? Math.min(100, nd.covered / p.dur * 100) + "%" : "0";
  $("pauseBtn").classList.toggle("on", p.paused);
  $("pauseBtn").querySelector("small").textContent = p.paused ? "再生" : "一時停止";
  if (!volDragging) { $("vol").value = p.volume; }
  $("volVal").textContent = volDragging ? $("vol").value : p.volume;
  for (const el of document.querySelectorAll(".volume button, #vol")) el.disabled = !n || !p.running;
  $("muteBtn").classList.toggle("on", p.muted);
  $("muteBtn").firstChild.textContent = p.muted ? "🔇" : "🔊";
  $("muteBtn").querySelector("small").textContent = p.muted ? "解除" : "ミュート";
  $("maxBtn").classList.toggle("on", p.maximized);
  $("maxBtn").querySelector("small").textContent = s.web ? "全画面" : p.maximized ? "元に戻す" : "最大化";
  for (const b of document.querySelectorAll(".controls button")) b.disabled = !n || !p.running;
  $("optQ720").checked = s.q720;
  const ch = s.channel;
  $("chBtn").classList.toggle("on", !!ch);
  $("chBtn").querySelector("small").textContent = ch ? "解除" : "このチャンネル";
  $("chBtn").dataset.on = ch ? "0" : "1";
  if (ch) $("chBtn").disabled = false;  // 停止中でも解除はできるように
  const rd = s.radio;
  $("radioBtn").classList.toggle("on", !!rd);
  $("radioBtn").querySelector("small").textContent = rd ? "解除" : "ラジオ";
  $("radioBtn").dataset.on = rd ? "0" : "1";
  if (rd) $("radioBtn").disabled = false;
  $("chmode").textContent = ch ? `📺 チャンネル「${ch.name}」から選んでいます`
    : rd ? `📻 「${rd.title}」のラジオから選んでいます` : "";
  $("chmode").style.display = ch || rd ? "" : "none";

  // 別の端末でスタートされた（サーバーのリクエスト・選択が変わった）ら、こちらで触りかけでも上書きする
  const serverForm = JSON.stringify([s.request, s.opts]);
  if (serverForm !== lastServerForm) { lastServerForm = serverForm; formTouched = false; }
  if (!formTouched) {
    $("request").value = s.request;
    $("optLive").checked = s.opts.live;
    $("optLong").checked = s.opts.long;
    $("optNewest").checked = s.opts.newest;
    $("optMode").value = s.opts.mode || "normal";
    $("optSubs").checked = !!s.opts.subs;
    $("optEn").checked = !!s.opts.en;
    $("optMusic").checked = !!s.opts.music;
    $("optYtm").checked = !!s.opts.ytm;
  }
  $("queries").textContent = s.queries.length
    ? (s.opts.ytm ? "🎵 YouTube Music で探しています　"
       : { music: "🎵 音楽として探しています　", channel: "📺 チャンネルから探しています　" }[s.kind] || "")
      + (s.filters ? "【" + s.filters + "】 " : "")
      + (s.traits ? "（基準: " + s.traits + "） " : "")
      + "検索ワード: " + s.queries.join(" / ") + (s.claude_live && !s.opts.live ? "（Claude の判断でライブも含む）" : "")
    : "";

  // 吹き替え（英語の動画）の状態：できていれば 🗣、作っていれば進み具合
  const dubBadge = (ds) => !ds ? "" : ds.st === "ready" ? ' ／ <span class="dubok">🗣 吹き替えあり</span>'
    : ds.st === "partial" ? ` ／ <span class="dubok">🗣 途中まで吹き替えあり</span>（${esc(ds.msg || "")}）`
    : ds.st === "working" ? ` ／ 🗣 作っています ${esc(ds.msg || "")}` : ds.st === "checking" ? " ／ 🗣 言語を確認中" : "";
  $("optAuto").checked = s.auto !== false;
  if (dragging) return;  // 並べ替えの途中は描き直さない
  $("queue").innerHTML = s.queue.map((v, i) => `
    <li data-i="${i}">
      <div class="grip" title="押さえて上下に動かすと順番が変わる">≡</div>
      ${thumbHtml(v, "テレビの Brave で開くもの")}
      <div>
        <div class="title">${esc(v.title)}</div>
        <div class="meta">${esc(v.channel || "")} ／ ${durOf(v)}${dubBadge((s.dub || {})[v.id])}</div>
        ${v.reason ? `<div class="reason">${esc(v.reason)}</div>` : ""}
      </div>
      <div class="acts">
        <button data-act="play" data-index="${i}" title="今すぐ再生">▶</button>
        <button data-act="drop" data-index="${i}" title="キューから外す">✕</button>
      </div>
    </li>`).join("");
  $("queueEmpty").style.display = s.queue.length ? "none" : "";
  $("queueEmpty").textContent = s.picking ? "選んでいます…" : "まだありません";
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const body = {};
  if (b.dataset.index !== undefined) body.index = Number(b.dataset.index);
  if (b.dataset.sec !== undefined) body.sec = Number(b.dataset.sec);
  if (b.dataset.ev !== undefined) body.ev = b.dataset.ev;
  if (b.dataset.delta !== undefined) body.delta = Number(b.dataset.delta);
  if (b.dataset.on !== undefined) body.on = b.dataset.on === "1";
  api(b.dataset.act, body);
});

$("bar").addEventListener("click", (e) => {
  if (!state || !state.player.dur) return;
  const r = e.currentTarget.getBoundingClientRect();
  const target = (e.clientX - r.left) / r.width * state.player.dur;
  api("seek", { sec: target - state.player.pos });
});

// 音量スライダー：動かしている間は 150ms ごとにまとめて送る
let volDragging = false, volTimer = null;
$("vol").addEventListener("input", () => {
  volDragging = true;
  $("volVal").textContent = $("vol").value;
  if (!volTimer) volTimer = setTimeout(() => { volTimer = null; api("volume", { vol: Number($("vol").value) }); }, 150);
});
$("vol").addEventListener("change", () => {
  clearTimeout(volTimer); volTimer = null;
  api("volume", { vol: Number($("vol").value) });
  volDragging = false;
});

$("optQ720").addEventListener("change", (e) => api("q720", { on: e.target.checked }));

// YouTube Music で選ぶなら音楽だけ
$("optYtm").addEventListener("change", (e) => { if (e.target.checked) $("optMusic").checked = true; });
$("optMusic").addEventListener("change", (e) => { if (!e.target.checked) $("optYtm").checked = false; });

for (const id of ["request", "optLive", "optLong", "optNewest", "optMode", "optSubs", "optEn", "optMusic", "optYtm"]) {
  $(id).addEventListener("input", () => { formTouched = true; });
  $(id).addEventListener("change", () => { formTouched = true; });
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const request = $("request").value.trim();
  if (!request) return $("request").focus();
  formTouched = false;
  api("start", { request, opts: { live: $("optLive").checked, long: $("optLong").checked, newest: $("optNewest").checked,
                          mode: $("optMode").value, subs: $("optSubs").checked, en: $("optEn").checked,
                          music: $("optMusic").checked, ytm: $("optYtm").checked } });
});
$("request").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("form").requestSubmit();
});

// サーバーの起動し直しなどで切れたら自分でつなぎ直す。EventSource は応答がエラーだとそれきり諦める（CLOSED）ので、
// そのときは 3 秒後に作り直す。画面に戻ってきたとき・30 秒何も届かないとき（ping は 15 秒ごと）もつなぎ直す
let es = null, esLast = Date.now();
function connect() {
  if (es) es.close();
  es = new EventSource("/events?t=" + encodeURIComponent(token));
  esLast = Date.now();
  es.onopen = () => { esLast = Date.now(); };
  es.onmessage = (e) => { esLast = Date.now(); render(JSON.parse(e.data)); };
  es.addEventListener("ping", () => { esLast = Date.now(); });
  es.onerror = () => {
    $("status").textContent = "再接続中…";
    if (es.readyState === EventSource.CLOSED) setTimeout(connect, 3000);
  };
}
connect();
document.addEventListener("visibilitychange", () => { if (!document.hidden && (!es || es.readyState !== EventSource.OPEN)) connect(); });
setInterval(() => { if (!document.hidden && Date.now() - esLast > 35000) connect(); }, 5000);
</script>
</body>
