# autotube Web 版の mpv キー割り当て（web.py が IPC で受け取る）
n script-message autotube-next                 # 次の動画へ
g script-message autotube-good                 # 👍
b script-message autotube-bad                  # 👎
# q は mpv の既定どおり終了（Web 画面から再開できる）

# F9 を押しながらのキー（tonzura の keyd が Ctrl+Alt+Shift+キー にして送る。Brave の拡張機能 tv-fullscreen と同じ割り当て）
# mpv は Shift で文字が変わるキーを変わった後の文字で受ける（JIS 配列：M→M、1→!、0→~、,→< など）。矢印と Space は Shift が付いたまま
Ctrl+Alt+Shift+LEFT  osd-msg-bar seek -10      # F9＋← 10 秒戻る
Ctrl+Alt+J           osd-msg-bar seek -10      # F9＋J
Ctrl+Alt+Shift+RIGHT osd-msg-bar seek 10       # F9＋→ 10 秒進む
Ctrl+Alt+L           osd-msg-bar seek 10       # F9＋L
Ctrl+Alt+Shift+UP    add volume 10             # F9＋↑ 音量
Ctrl+Alt+Shift+DOWN  add volume -10            # F9＋↓
Ctrl+Alt+SPACE       cycle pause               # F9＋Space 再生・一時停止
Ctrl+Alt+K           cycle pause               # F9＋K
Ctrl+Alt+M           cycle mute                # F9＋M ミュート
Ctrl+Alt+<           add speed -0.25           # F9＋, 遅く
Ctrl+Alt+>           add speed 0.25            # F9＋. 速く
Ctrl+Alt+?           set speed 1.0             # F9＋/ 速度 1 倍
Ctrl+Alt+~           osd-msg-bar seek 0 absolute          # F9＋0 先頭へ
Ctrl+Alt+!           osd-msg-bar seek 10 absolute-percent # F9＋1〜9 その割合の位置へ
Ctrl+Alt+"           osd-msg-bar seek 20 absolute-percent
Ctrl+Alt+SHARP       osd-msg-bar seek 30 absolute-percent
Ctrl+Alt+$           osd-msg-bar seek 40 absolute-percent
Ctrl+Alt+%           osd-msg-bar seek 50 absolute-percent
Ctrl+Alt+&           osd-msg-bar seek 60 absolute-percent
Ctrl+Alt+'           osd-msg-bar seek 70 absolute-percent
Ctrl+Alt+(           osd-msg-bar seek 80 absolute-percent
Ctrl+Alt+)           osd-msg-bar seek 90 absolute-percent
Ctrl+Alt+C           cycle sub                 # F9＋C 字幕
# F6＋H／; で 1 分戻る・進む、F6＋G／:（JIS の ; の右）で 3 分。Shift が付くので ; は +、: は * で届く
Ctrl+Alt+H           osd-msg-bar seek -60      # F6＋H 1 分戻る
Ctrl+Alt++           osd-msg-bar seek 60       # F6＋; 1 分進む
Ctrl+Alt+G           osd-msg-bar seek -180     # F6＋G 3 分戻る
Ctrl+Alt+*           osd-msg-bar seek 180      # F6＋: 3 分進む
